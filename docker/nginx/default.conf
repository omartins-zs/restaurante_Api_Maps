server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # DNS Resolver interno do Docker para evitar falha de upstream na inicialização
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Compressão Gzip para alta performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Endpoint de Healthcheck
    location = /api/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"restaurante-api-maps"}';
    }

    # Cache agressivo para assets estáticos com hash
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Suporte a rotas SPA do React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
