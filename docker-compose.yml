services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: restaurante_maps_app
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app_public:/var/www/shared_public
    networks:
      - restaurante_network

  nginx:
    image: nginx:1.25-alpine
    container_name: restaurante_maps_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - app_public:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - restaurante_network

  mysql:
    image: mysql:8.0
    container_name: restaurante_maps_mysql
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-restaurante_maps}
      MYSQL_USER: ${DB_USERNAME:-restaurante_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - restaurante_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: restaurante_maps_phpmyadmin
    restart: unless-stopped
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - restaurante_network

volumes:
  app_public:
  mysql_data:

networks:
  restaurante_network:
    driver: bridge
